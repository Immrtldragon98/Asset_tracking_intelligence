name: Frontend build
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify navigation and equipment identity
        run: npm run check:navigation && node scripts/check-equipment.cjs
      - name: Build Next.js application
        run: npm run build
      - name: Install browser verification tools
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright
          npx playwright install --with-deps chromium
      - name: Verify desktop and mobile workspaces
        run: node scripts/check-workspace-browser.cjs
      - name: Verify frontend Docker image
        working-directory: .
        run: docker build -f frontend/Dockerfile frontend
