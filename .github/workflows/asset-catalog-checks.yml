name: Asset catalog checks
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/asset-catalog-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Verify catalog route syntax
        run: python -m compileall -q app/api/routes/assets.py app/services/asset_catalog_service.py app/repositories/asset_catalog_repository.py
      - name: Verify read-only catalog identity
        run: PYTHONPATH=. pytest -q tests/test_asset_catalog_service.py
